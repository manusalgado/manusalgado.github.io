    const html = await open(document.getElementById('u').value.trim(), document.getElementById('p').value);
    try { sessionStorage.setItem('sp:session', JSON.stringify([document.getElementById('u').value.trim(), document.getElementById('p').value])); } catch (_) {}
    show(html);
  } catch (_) { e.textContent = 'Usuario o contrasena incorrectos'; b.disabled = false; b.textContent = 'Entrar'; }
};
// sesion activa en esta pestana: entra directo
try { const s = JSON.parse(sessionStorage.getItem('sp:session') || 'null'); if (s) open(s[0], s[1]).then(show).catch(() => sessionStorage.removeItem('sp:session')); } catch (_) {}
