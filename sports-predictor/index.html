async function open(u, p) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(u + '\n' + p), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: dec(P.salt), iterations: P.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

  try {
