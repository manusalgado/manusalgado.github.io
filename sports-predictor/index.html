async function open(u, p) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(u + '\n' + p), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: dec(P.salt), iterations: P.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(P.iv) }, key, dec(P.ct));
  return new TextDecoder().decode(plain);
}

document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Verificando...'; e.textContent = '';
  try {
    const html = await open(document.getElementById('u').value.trim(), document.getElementById('p').value);
    try { sessionStorage.setItem('sp:session', JSON.stringify([document.getElementById('u').value.trim(), document.getElementById('p').value])); } catch (_) {}
    show(html);
  } catch (_) { e.textContent = 'Usuario o contrasena incorrectos'; b.disabled = false; b.textContent = 'Entrar'; }
